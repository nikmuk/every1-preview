<!doctype html>

<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone-shaped app, dark by design, framed on wide screens and
   full-bleed on phones. One idea carries the look: every person has a living
   "aura" built from four warm-to-cool hues, and the same hues light up
   whatever you've noticed about them. Floating glass nav, bento home,
   swipeable cards, sheets that slide up. Deliberately single-theme. */
:root {
  --bg: #0d0a12;
  --bg-2: #15101c;
  --card: rgba(255, 255, 255, 0.055);
  --card-hi: rgba(255, 255, 255, 0.09);
  --line: rgba(255, 255, 255, 0.1);
  --text: #f7f3fb;
  --muted: #bcb3c9;
  --faint: #857c93;
  --peach: #ff9e7a;
  --pink: #ff5c9a;
  --lilac: #b79cff;
  --mint: #6ff2c9;
  --sun: #ffd66b;
  --warn: #ffb35c;

  --aura: radial-gradient(circle at 30% 30%, var(--peach), transparent 55%),
          radial-gradient(circle at 75% 35%, var(--pink), transparent 55%),
          radial-gradient(circle at 40% 80%, var(--lilac), transparent 60%),
          radial-gradient(circle at 80% 80%, var(--mint), transparent 55%);

  --display: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --body: 'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 22px;
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); line-height: 1.45; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
input, textarea { font: inherit; color: var(--text); }
:focus-visible { outline: 2px solid var(--lilac); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.02em; line-height: 1.02; text-wrap: balance; }
p { margin: 0; }

/* The phone frame */
.stage { min-height: 100%; display: grid; place-items: start center; padding-block: 0; padding-inline: 0; }
@media (min-width: 520px) { .stage { padding-block: 28px; padding-inline: 16px; background: radial-gradient(60% 50% at 50% 0%, #22152e 0%, var(--bg) 70%); } }
.phone { position: relative; width: 100%; max-width: 420px; min-height: 100vh; background: var(--bg); overflow: hidden; overflow: clip; isolation: isolate; }
@media (min-width: 520px) { .phone { min-height: 860px; height: 860px; border-radius: 44px; border: 1px solid var(--line); box-shadow: 0 40px 120px rgba(0,0,0,0.6), 0 0 0 10px #050308; } }
.phone::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 30; opacity: 0.07;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 42; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px;
  padding: 10px 12px 8px; background: linear-gradient(var(--bg) 60%, rgba(13,10,18,0)); }
.topbar button { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: rgba(24,18,32,0.72);
  border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-size: 1.25rem; font-weight: 800; color: var(--text); text-align: center; transition: transform .12s, opacity .15s; }
.topbar button:active { transform: scale(0.9); }
.topbar button:disabled { opacity: 0.28; cursor: default; }
.topbar .ttl { text-align: center; font-family: var(--display); font-weight: 700; font-size: 1rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-inline: 18px; padding-block: 70px 120px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
#view { position: relative; overflow-x: clip; margin-inline: -18px; padding-inline: 18px; }
.glow { position: absolute; width: 380px; height: 380px; border-radius: 50%; filter: blur(70px); opacity: 0.35; z-index: -1; pointer-events: none; background: var(--aura); }

/* Glass nav */
.nav { position: absolute; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  background: rgba(24, 18, 32, 0.72); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border: 1px solid var(--line); border-radius: 28px; padding: 8px 6px; }
.nav button { display: grid; place-items: center; gap: 2px; font-size: 0.68rem; color: var(--faint); padding: 4px 0; font-weight: 600; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--text); }
.nav .plus { width: 52px; height: 52px; margin: -20px auto 0; border-radius: 18px; background: var(--aura), #2a1d3a; color: #160f1d; font-size: 1.8rem; font-weight: 800; box-shadow: 0 10px 30px rgba(255, 92, 154, 0.35); transition: transform 0.15s; }
.nav .plus:active { transform: scale(0.92) rotate(-6deg); }

/* Type + text helpers */
.eyebrow { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
.muted { color: var(--muted); }
.faint { color: var(--faint); font-size: 0.82rem; }
.big { font-size: 2.4rem; }
.huge { font-size: 3.4rem; }
.grad-text { background: linear-gradient(90deg, var(--peach), var(--pink), var(--lilac)); -webkit-background-clip: text; background-clip: text; color: transparent; }

.col { display: flex; flex-direction: column; gap: 12px; }
.col-sm { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grow { flex: 1; min-width: 0; }

/* Cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; position: relative; overflow: hidden; }
.tap { transition: transform 0.15s ease, background 0.15s; }
.tap:active { transform: scale(0.97); }
.tap:hover { background: var(--card-hi); }
.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bento .wide { grid-column: span 2; }
.card.aura-card { background: linear-gradient(160deg, rgba(255,158,122,0.22), rgba(183,156,255,0.16) 60%, rgba(111,242,201,0.14)); border-color: rgba(255,255,255,0.16); }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.pill.hot { background: rgba(255, 92, 154, 0.16); border-color: rgba(255, 92, 154, 0.4); color: #ffc2d8; }
.pill.mint { background: rgba(111, 242, 201, 0.12); border-color: rgba(111, 242, 201, 0.35); color: #b6fbe6; }
.pill.lock { background: rgba(183, 156, 255, 0.12); border-color: rgba(183, 156, 255, 0.35); color: #ddd1ff; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }

.btn { display: block; width: 100%; text-align: center; padding: 15px 18px; border-radius: 18px; font-weight: 700; font-size: 1rem; color: #170f1e;
  background: linear-gradient(95deg, var(--peach), var(--pink) 55%, var(--lilac)); box-shadow: 0 10px 30px rgba(255, 92, 154, 0.28); transition: transform 0.15s; }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.35; box-shadow: none; }
.btn-ghost { display: block; width: 100%; text-align: center; padding: 13px 18px; border-radius: 18px; font-weight: 700; background: var(--card); border: 1px solid var(--line); }
.chip { padding: 9px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 600; font-size: 0.88rem; transition: transform 0.12s, background 0.12s; }
.chip:active { transform: scale(0.94); }
.chip[aria-pressed="true"] { background: var(--text); color: #170f1e; border-color: var(--text); }

/* Aura avatars */
.ava { position: relative; width: 58px; height: 58px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.3rem; color: #170f1e; }
.ava { background: #1b1424; overflow: hidden; }
.ava canvas { width: 100%; height: 100%; display: block; }
.ava .blob { position: absolute; inset: 0; border-radius: 50%; background: var(--aura), #3a2a4a; animation: spin 14s linear infinite; }
.ava span { position: relative; }
.ring { position: relative; padding: 3px; border-radius: 50%; background: conic-gradient(var(--peach), var(--pink), var(--lilac), var(--mint), var(--peach)); }
.ring.dim { background: var(--line); }
.ring > .ava { border: 3px solid var(--bg); }
.badge { position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 0.7rem; background: var(--bg-2); border: 1px solid var(--line); }
@keyframes spin { to { transform: rotate(360deg); } }

.stories { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; margin-inline: -18px; padding-inline: 18px; scrollbar-width: none; }
.stories::-webkit-scrollbar { display: none; }
.story { display: grid; justify-items: center; gap: 6px; font-size: 0.74rem; font-weight: 600; color: var(--muted); flex: none; }
.story .add { width: 64px; height: 64px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-size: 1.5rem; color: var(--faint); }

/* The aura orb on a person page */
.orb-wrap { position: relative; width: 300px; max-width: 100%; aspect-ratio: 1; margin: 0 auto; }
.orb { position: absolute; inset: 30%; border-radius: 50%; background: var(--aura), #2b1f38; filter: saturate(1.2); animation: breathe 6s ease-in-out infinite, spin 30s linear infinite; box-shadow: 0 0 80px rgba(255, 92, 154, 0.35); }
.orb-init { position: absolute; inset: 30%; display: grid; place-items: center; font-family: var(--display); font-size: 3.2rem; font-weight: 800; color: #170f1e; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.orb-ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.orb-ring .seg { fill: none; stroke-width: 15; stroke-linecap: round; cursor: pointer; transition: stroke-width 0.15s; }
.orb-ring .seg:hover { stroke-width: 19; }
.orb-ring .off { stroke: rgba(255,255,255,0.08); stroke-dasharray: 3 7; stroke-width: 10; }
.orb-ring .hit { fill: transparent; cursor: pointer; }
.orb-ring text { fill: var(--muted); font-family: var(--body); font-size: 10.5px; font-weight: 700; pointer-events: none; }
.orb-ring text.off-t { fill: var(--faint); font-weight: 500; }

.tabs { display: flex; gap: 6px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; }
.tabs button { flex: 1; text-align: center; padding: 9px 4px; border-radius: 999px; font-weight: 700; font-size: 0.84rem; color: var(--faint); }
.tabs button[aria-current="true"] { background: var(--text); color: #170f1e; }

.hscroll { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -18px; padding-inline: 18px; padding-bottom: 6px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { scroll-snap-align: start; flex: none; width: 78%; }

.note { display: grid; grid-template-columns: 36px 1fr; gap: 10px; }
.note .em { width: 36px; height: 36px; border-radius: 12px; background: var(--card-hi); display: grid; place-items: center; font-size: 1.05rem; }
.note + .note { border-top: 1px solid var(--line); padding-top: 12px; }
.read { font-style: italic; color: var(--lilac); font-size: 0.9rem; }
/* Rival explanations: every guess shows its doubt (overview §10 rule 2). */
.rivals { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; padding-top: 10px; border-top: 1px dashed rgba(183, 156, 255, 0.35); }
.rivals .eyebrow { color: #cdbbff; }
.rival { padding: 8px 12px; border-radius: 14px; border: 1px dashed rgba(183, 156, 255, 0.45); background: rgba(183, 156, 255, 0.08); color: #e6dcff; font-size: 0.9rem; font-weight: 600; }
.btn-danger { display: block; width: 100%; text-align: center; padding: 13px 18px; border-radius: 18px; font-weight: 700; background: rgba(255, 92, 154, 0.14); border: 1px solid rgba(255, 92, 154, 0.5); color: #ffc2d8; }

.sticker { border-radius: 18px; padding: 12px 14px; font-weight: 600; font-size: 0.92rem; transform: rotate(-0.6deg); }
.sticker.warn { background: rgba(255, 179, 92, 0.14); border: 1px solid rgba(255, 179, 92, 0.45); color: #ffd9a8; }
.sticker.stop { background: rgba(255, 92, 154, 0.14); border: 1px solid rgba(255, 92, 154, 0.5); color: #ffc2d8; transform: rotate(0.6deg); }
.sticker.cool { background: rgba(111, 242, 201, 0.1); border: 1px solid rgba(111, 242, 201, 0.4); color: #c3fbea; }

.field { width: 100%; padding: 14px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); font-size: 1rem; }
textarea.field { min-height: 110px; resize: none; line-height: 1.4; }
.field::placeholder { color: var(--faint); }

/* Sheets */
.sheet-back { position: absolute; inset: 0; background: rgba(5, 3, 8, 0.6); z-index: 40; animation: fade 0.2s ease; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; z-index: 41; background: var(--bg-2); border-top: 1px solid var(--line); border-radius: 30px 30px 0 0; padding-inline: 18px; padding-block: 10px 30px; animation: up 0.28s cubic-bezier(.2,.9,.3,1.1); scrollbar-width: none; }
.sheet::-webkit-scrollbar { display: none; }
.grab { width: 44px; height: 5px; border-radius: 999px; background: var(--line); margin: 4px auto 14px; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }

/* Onboarding stories */
.ob { position: absolute; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; padding-inline: 20px; padding-block: 16px 30px; }
.ob .bars { display: flex; gap: 4px; }
.ob .bars i { flex: 1; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.ob .bars i b { display: block; height: 100%; width: 0; background: var(--text); }
.ob .bars i.done b { width: 100%; }
.ob .bars i.now b { animation: bar 5s linear forwards; }
@keyframes bar { to { width: 100%; } }
.ob .stage-art { flex: 1; display: grid; place-items: center; position: relative; }
.ob .tapzone { position: absolute; inset: 60px 0 160px; display: grid; grid-template-columns: 1fr 2fr; z-index: 2; }

/* Swipe game */
.deck { position: relative; height: 430px; }
.gcard { position: absolute; inset: 0; border-radius: 30px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; touch-action: none; user-select: none;
  background: linear-gradient(165deg, #2a1d3a, #1a1324); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 30px 60px rgba(0,0,0,0.45); transition: transform 0.35s cubic-bezier(.2,.9,.3,1.2), opacity 0.3s; }
.gcard.behind { transform: scale(0.94) translateY(16px); opacity: 0.6; }
.gcard .opt { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 12px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); font-weight: 700; }
.gcard .opt .e { font-size: 1.7rem; text-align: center; }
.gcard .hint-l, .gcard .hint-r { position: absolute; top: 22px; padding: 6px 12px; border-radius: 12px; font-weight: 800; font-family: var(--display); font-size: 1.1rem; opacity: 0; transition: opacity 0.1s; }
.gcard .hint-l { left: 20px; border: 2px solid var(--peach); color: var(--peach); transform: rotate(-10deg); }
.gcard .hint-r { right: 20px; border: 2px solid var(--mint); color: var(--mint); transform: rotate(10deg); }
.progress { display: flex; gap: 5px; }
.progress i { flex: 1; height: 5px; border-radius: 5px; background: var(--line); }
.progress i.on { background: linear-gradient(90deg, var(--peach), var(--pink)); }

/* Share card */
.share { aspect-ratio: 9 / 14; border-radius: 30px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;
  background: linear-gradient(160deg, #ff9e7a 0%, #ff5c9a 38%, #b79cff 72%, #6ff2c9 110%); color: #170f1e; box-shadow: 0 30px 80px rgba(255, 92, 154, 0.35); }
.share .blob2 { position: absolute; width: 260px; height: 260px; border-radius: 50%; right: -80px; top: 90px; background: rgba(255,255,255,0.25); filter: blur(10px); }
.share h2 { font-size: 3rem; position: relative; }
.share .meter { display: flex; gap: 6px; position: relative; }
.share .meter i { flex: 1; height: 14px; border-radius: 8px; background: rgba(23,15,30,0.18); }
.share .meter i.on { background: #170f1e; }

.toast { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 60; background: var(--text); color: #170f1e; font-weight: 700; padding: 10px 16px; border-radius: 16px; font-size: 0.9rem; width: max-content; max-width: calc(100% - 36px); animation: pop 0.25s cubic-bezier(.2,.9,.3,1.4); }
@keyframes pop { from { transform: translateX(-50%) scale(0.8); opacity: 0; } }
canvas.confetti { position: absolute; inset: 0; pointer-events: none; z-index: 55; }

.pop-in { animation: popin 0.4s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes popin { from { transform: scale(0.85) translateY(10px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="stage">
  <div class="phone" id="phone">
    <div class="topbar" id="topbar">
      <button id="hback" data-act="hback" aria-label="Back" title="Back">←</button>
      <span class="ttl" id="httl"></span>
      <button id="hfwd" data-act="hfwd" aria-label="Forward" title="Forward">→</button>
    </div>
    <div class="scroll" id="scroll"><div id="view"></div></div>
    <nav class="nav" id="nav" aria-label="Main">
      <button data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
      <button data-nav="people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 20c0-2.4 1.6-4.4 4-4.9"/></svg>People</button>

      <button data-nav="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>Me</button>
    </nav>
    <div id="layer"></div>
  </div>
</div>

<script>
(() => {

  const PEOPLE = [

      ],

      asks: []

    { id: 'maya', n: 'Maya', ctx: 'Colleague', locked: true,

  /* ------------------------------------------------------------------
   * Person — the aura orb with a ring of what you've noticed.
   * ---------------------------------------------------------------- */
  function orbRing(p) {
    const C = 150, R = 136, n = DOMAINS.length, gap = 0.1;
    const span = (Math.PI * 2) / n;
    const hues = ['var(--peach)', 'var(--pink)', 'var(--lilac)', 'var(--mint)', 'var(--sun)', 'var(--peach)', 'var(--lilac)'];
    let out = '';
    DOMAINS.forEach((d, i) => {
      const a0 = -Math.PI / 2 + i * span + gap, a1 = a0 + span - gap * 2;
      const count = p.notes.filter(x => x.d === d.k).length;
      const pt = (a, r) => (C + Math.cos(a) * r).toFixed(1) + ' ' + (C + Math.sin(a) * r).toFixed(1);
      const path = 'M' + pt(a0, R) + ' A' + R + ' ' + R + ' 0 0 1 ' + pt(a1, R);
      out += count
        ? '<path class="seg" data-act="dom" data-d="' + d.k + '" d="' + path + '" style="stroke:' + hues[i] + ';opacity:' + Math.min(1, 0.45 + count * 0.18) + '"><title>' + d.full + '</title></path>'
        : '<path class="seg off" data-act="dom" data-d="' + d.k + '" d="' + path + '"><title>' + d.full + ': nothing noticed yet</title></path>';
      // A generous invisible wedge so the whole slice is tappable, not just the thin arc.
      const Ri = 92, Ro = 150;
      out += '<path class="hit" data-act="dom" data-d="' + d.k + '" d="M' + pt(a0, Ro) + ' A' + Ro + ' ' + Ro + ' 0 0 1 ' + pt(a1, Ro) +
        ' L' + pt(a1, Ri) + ' A' + Ri + ' ' + Ri + ' 0 0 0 ' + pt(a0, Ri) + ' Z"><title>' + d.full + '</title></path>';
      const am = (a0 + a1) / 2, lr = R - 30;
      out += '<text x="' + (C + Math.cos(am) * lr).toFixed(1) + '" y="' + (C + Math.sin(am) * lr + 3).toFixed(1) + '" text-anchor="middle" class="' + (count ? '' : 'off-t') + '">' + d.l + (count ? ' · ' + count : '') + '</text>';
    });
    return '<svg class="orb-ring" viewBox="0 0 300 300" role="img" aria-label="What you have noticed about ' + esc(p.n) + ', by area">' + out + '</svg>';
  }

  function person() {
    const p = P(S.pid);

        (() => { const sp = specFor(p), st = STAGES[sp.stage];
          return '<div class="card col-sm" style="text-align:center;align-items:center"><div class="row" style="justify-content:center"><span class="pill ' + (sp.stage === 3 ? 'mint' : sp.stage === 2 ? 'lock' : '') + '">' + st.e + ' Stage ' + sp.stage + ' of 3 · ' + st.k + '</span></div>' +
            '<p class="faint">' + (sp.stage === 3 ? 'Fully grown. You\'ve checked plenty with ' + esc(p.n) + ' directly.' : 'Sharpens when you check things with ' + esc(p.n) + ': ask, try something, hear it from them. Adding more notes won\'t do it.') + '</p>' +
            '<div class="row" style="justify-content:center;flex-wrap:wrap"><button class="pill" data-act="evolve">▶ Watch it grow</button><button class="pill" data-act="legend">What shapes it?</button></div></div>'; })() +
        '<p class="faint" style="text-align:center">You\'ve noticed things in ' + lit + ' of 7 areas. Dotted means nothing yet, and that\'s fine. Tap a glowing area to open it.</p>' +

    }
    if (S.tab === 'ask') {

        (p.asks.length ? p.asks.map((a, i) => '<div class="card col"><b style="font-size:1.05rem">' + esc(a.q) + '</b>' +
          '<div style="background:rgba(183,156,255,0.14);border:1px solid rgba(183,156,255,0.35);border-radius:20px 20px 6px 20px;padding:12px 14px;align-self:flex-end;max-width:88%">' + esc(a.msg) + '</div>' +
          '<div class="bento"><button class="btn-ghost" data-act="copy" data-i="' + i + '">Copy text</button><button class="btn-ghost" data-act="asked">I asked ✓</button></div>' +
          '<p class="faint">If they\'d rather not say, that\'s the answer. It doesn\'t count as anything.</p></div>').join('')
          : '<div class="card"><p class="muted">No open questions yet. Keep noticing, and they\'ll show up here.</p></div>');
    }
    if (S.tab === 'together') {
      body = '<div class="card col"><p class="eyebrow">On bad days</p><div class="bento">' +
        '<div class="col-sm"><span class="faint">You noticed</span><p>👀 ' + esc(p.notes[0].t) + '</p></div>' +
        '<div class="col-sm"><span class="faint">Sam says</span><p>✨ ' + esc(p.notes[1].t) + '</p></div></div>' +
        '<p class="faint">Both stay as they are. Nobody "wins". The gap is the interesting part: maybe the walk was his alone time.</p></div>' +
        '<button class="card tap col" data-nav="guess"><span class="pill hot">✨ Round 4 ready</span><b style="font-size:1.1rem">Guess Sam\'s 5 answers</b><span class="faint">Nothing\'s revealed until you\'ve both played.</span></button>';
    }

    return '<div class="glow" style="top:-80px;left:0"></div>' +
      '<div class="between" style="margin-bottom:10px"><button data-nav="people" class="faint" style="font-weight:700">← People</button>' +
      (p.locked ? '<span class="pill lock">🔒 Only you see this</span>' : '<span class="pill mint">✨ ' + esc(p.n) + ' joined</span>') + '</div>' +
      '<div class="row" style="margin-bottom:14px">' + ava(p, 52, p.fresh ? '' : 'dim') + '<div><h1 style="font-size:2.1rem">' + esc(p.n) + '</h1><span class="faint">' + esc(p.ctx) + '</span></div></div>' +
      '<div class="tabs" style="margin-bottom:14px">' + tabs.map(([k, l]) => '<button data-tabk="' + k + '" aria-current="' + (S.tab === k) + '">' + l + '</button>').join('') + '</div>' +

  function patCard(x) {
    const b = BAND[x.b];

  function noteRow(x) {

  /* ------------------------------------------------------------------
   * Guess game — swipe cards.

  function guess() {

      '<div class="between faint"><span>← swipe for top</span><span>bottom →</span></div>';
    const next = GAME[g.i + 1];
    return '<div class="glow" style="top:40px;left:-100px"></div>' +
      '<div class="between" style="margin-bottom:12px"><button data-nav="home" class="faint" style="font-weight:700">✕</button><span class="faint" style="font-weight:700">' + (g.i + 1) + ' / ' + GAME.length + '</span></div>' +
      '<div class="progress" style="margin-bottom:16px">' + GAME.map((_, i) => '<i class="' + (i < g.i ? 'on' : '') + '"></i>').join('') + '</div>' +
      '<div class="deck">' + (next ? '<div class="gcard behind">' + card(next) + '</div>' : '') +

      '<div class="bento" style="margin-top:16px"><button class="btn-ghost" data-act="pick" data-v="a">' + GAME[g.i].a[0] + ' ' + esc(GAME[g.i].a[1]) + '</button><button class="btn-ghost" data-act="pick" data-v="b">' + GAME[g.i].b[0] + ' ' + esc(GAME[g.i].b[1]) + '</button></div>' +
      '<p class="faint" style="text-align:center;margin-top:12px">Sam already answered. You\'ll both see the reveal together.</p>';
  }

  function reveal() {
    const g = S.game;
    const miss = GAME.find((c, i) => g.picks[i] !== c.sam);
    return '<div class="glow" style="top:0;left:-60px;opacity:.5"></div>' +
      '<p class="eyebrow" style="text-align:center">Round 4 · unsealed 🔓</p>' +
      '<h1 class="big pop-in" style="text-align:center;margin:8px 0 6px">You both played. <span class="grad-text">Here\'s what each of you said.</span></h1>' +
      '<p class="faint" style="text-align:center;margin-bottom:16px">No score. The surprises are the good part.</p>' +
      '<div class="col">' + GAME.map((c, i) => {
        const ok = g.picks[i] === c.sam;
        return '<div class="card row pop-in" style="animation-delay:' + (i * 0.08) + 's"><span style="font-size:1.6rem">' + c[c.sam][0] + '</span><div class="grow"><b>' + esc(c.q) + '</b><p class="faint">Sam: ' + esc(c[c.sam][1]) + (ok ? '' : ' · you guessed ' + esc(c[g.picks[i]][1])) + '</p></div><span class="pill ' + (ok ? 'mint' : 'hot') + '">' + (ok ? 'in sync' : 'surprise') + '</span></div>';
      }).join('') + '</div>' +
      (miss ? '<div class="sticker cool" style="margin-top:14px">💡 Worth a chat: "' + esc(miss.q.replace('…', '')) + '". You thought ' + esc(miss[g.picks[GAME.indexOf(miss)]][1].toLowerCase()) + ', he said ' + esc(miss[miss.sam][1].toLowerCase()) + '. Ask him about it, don\'t just log it.</div>' : '') +

    const sync = [...new Set(GAME.filter((c, i) => g.picks[i] === c.sam).map(c => c.dom.toLowerCase()))].slice(0, 2);
    return '<div class="grab"></div>' +
      '<div class="share pop-in"><div class="blob2"></div>' +
      '<div class="between" style="position:relative"><b style="font-family:var(--display);font-size:1.1rem">EVERY1</b><span style="font-weight:700">Round 4</span></div>' +

        (miss ? esc(miss.q.replace('…', '')) + ' → ' + miss[miss.sam][0] + ' ' + esc(miss[miss.sam][1]) : 'None this round.') + '</p></div>' +

  }

  /* ------------------------------------------------------------------
   * Sheets: note composer, prep, domain, invite, privacy, add person.
   * ---------------------------------------------------------------- */
  const CHECKS = [
    { k: 'monitor', re: /\b(track|follow(ed)? (her|him|them)|check(ed)? (her|his|their) phone|where (she|he|they) (goes|went|was)|who (she|he|they)('?s| is| are| was)? (texting|seeing|messaging))\b/i, cls: 'stop', block: true,
      msg: '🛑 EVERY1 doesn\'t track where people go or who they talk to. If something\'s worrying you, let\'s talk about that instead.' },
    { k: 'health', re: /(\b(i think|probably|maybe|must be|seems?( to be)?|definitely|clearly)\b.{0,30}\b(depress\w*|adhd|autis\w*|bipolar|on the spectrum|ocd|narcissis\w*|psychopath\w*|sociopath\w*)\b)|(\b(she|he|they)('s| is| are)( a| an)? (depressed|adhd|autistic|bipolar|on the spectrum|ocd|narcissist\w*|psychopath\w*|sociopath\w*)\b)/i, cls: 'stop', block: true,
      msg: '🛑 We don\'t save guesses about someone\'s health or mental state. What did you actually see them do or say?' },
    { k: 'hearsay', re: /(\b(?!(?:He|She|They|We|I)\b)[A-Z][a-z]+ (said|says|told me) (that )?(he|she|they)\b)|(\b(my \w+|someone|people|everyone) (said|says|told me)\b)|(\b[Ii] heard (that )?(he|she|they)\b)|(\b[Aa]pparently,? (he|she|they)\b)/, cls: 'warn', q: true,
      msg: '🗣️ That\'s second-hand. It won\'t count as something you noticed, but it could be a question you ask.' },
    { k: 'trait', re: /\b(rude|lazy|selfish|needy|manipulative|controlling|toxic|passive[- ]aggressive|clingy|arrogant|cringe)\b/i, cls: 'cool', read: true,

  ];

  /* ------------------------------------------------------------------
   * Render.
   * ---------------------------------------------------------------- */
  const VIEWS = { home, people, person, guess, me };
  function render() {
    $('view').innerHTML = VIEWS[S.view]();
    document.querySelectorAll('#nav [data-nav]').forEach(b => {
      if (b.dataset.nav === S.view || (S.view === 'person' && b.dataset.nav === 'people')) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    $('nav').hidden = !S.obDone;
    renderLayer();
    syncArrows();
    if (S.view === 'guess' && S.game.i < GAME.length) bindSwipe();
  }
  function renderLayer() {
    let html = '';
    if (!S.obDone) html = onboarding();
    else if (S.sheet) {
      const body = { wrapped: wrappedSheet, note: noteSheet, prep: prepSheet, invite: inviteSheet, privacy: privacySheet, add: addSheet, share: shareSheet, legend: legendSheet, del: deleteSheet }[S.sheet.k];
      html = '<div class="sheet-back" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true">' + (S.sheet.k === 'dom' ? domSheet(S.sheet.d) : body()) + '</div>';
    }
    $('layer').innerHTML = html;
    if ($('hback')) syncArrows();
    if (S.sheet && S.sheet.k === 'del' && $('dlh')) $('dlh').focus();
  }
  /* Back / forward. Every screen change is an entry; the arrows and the
     phone's own back gesture both walk it. Sheets close before going back. */
  const HIST = [{ view: 'home', pid: null, tab: 'aura' }];
  let HI = 0, useHist = true;
  try { history.replaceState({ hi: 0 }, ''); } catch (e) { useHist = false; }
  function apply(snap) { S.view = snap.view; S.pid = snap.pid; S.tab = snap.tab; S.sheet = null; $('scroll').scrollTop = 0; render(); }
  function go(next) {
    const cur = HIST[HI], snap = { view: next.view, pid: next.pid !== undefined ? next.pid : S.pid, tab: next.tab || (next.view === S.view ? S.tab : 'aura') };
    if (cur.view === snap.view && cur.pid === snap.pid && cur.tab === snap.tab) { S.sheet = null; render(); return; }
    HIST.splice(HI + 1); HIST.push(snap); HI++;
    if (useHist) { try { history.pushState({ hi: HI }, ''); } catch (e) { useHist = false; } }
    apply(snap);
  }
  function nav(v) { go({ view: v }); }
  function goBack() {
    if (S.sheet) { S.sheet = null; renderLayer(); return; }
    if (HI === 0) return;
    if (useHist) history.back(); else { HI--; apply(HIST[HI]); }
  }
  function goFwd() {
    if (HI >= HIST.length - 1) return;
    if (useHist) history.forward(); else { HI++; apply(HIST[HI]); }
  }
  window.addEventListener('popstate', e => {
    const hi = e.state && typeof e.state.hi === 'number' ? e.state.hi : 0;
    if (hi < 0 || hi >= HIST.length) return;
    HI = hi; apply(HIST[HI]);
  });
  function syncArrows() {
    $('hback').disabled = HI === 0 && !S.sheet;
    $('hfwd').disabled = HI >= HIST.length - 1;
    const titles = { home: 'Home', people: 'People', guess: 'Guess', me: 'Me' };
    $('httl').textContent = S.view === 'person' ? (P(S.pid) ? P(S.pid).n : '') : titles[S.view] || '';
    $('topbar').hidden = !S.obDone;
  }
  function sheet(k, extra = {}) { S.sheet = { k, ...extra }; renderLayer(); }

  /* Swipe with pointer events; buttons do the same thing. */
  function bindSwipe() {
    const el = $('gcard'); if (!el) return;
    let x0 = null, dx = 0;
    const hl = el.querySelector('.hint-l'), hr = el.querySelector('.hint-r');
    el.addEventListener('pointerdown', e => { x0 = e.clientX; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; });
    el.addEventListener('pointermove', e => {
      if (x0 === null) return; dx = e.clientX - x0;
      el.style.transform = 'translateX(' + dx + 'px) rotate(' + dx / 14 + 'deg)';
      hl.style.opacity = Math.max(0, -dx / 90); hr.style.opacity = Math.max(0, dx / 90);
    });
    const end = () => {
      if (x0 === null) return; el.style.transition = '';
      if (Math.abs(dx) > 90) pick(dx < 0 ? 'a' : 'b', dx < 0 ? -1 : 1);
      else { el.style.transform = ''; hl.style.opacity = 0; hr.style.opacity = 0; }
      x0 = null; dx = 0;
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  }
  function pick(v, dir = v === 'a' ? -1 : 1) {
    const el = $('gcard');
    S.game.picks[S.game.i] = v;
    if (el) { el.style.transform = 'translateX(' + dir * 520 + 'px) rotate(' + dir * 28 + 'deg)'; el.style.opacity = '0'; }
    setTimeout(() => { S.game.i += 1; render(); if (S.game.i >= GAME.length) confetti(); }, 230);
  }

  function confetti() {
    const cv = document.createElement('canvas'); cv.className = 'confetti';
    const ph = $('phone'); cv.width = ph.clientWidth; cv.height = ph.clientHeight; ph.appendChild(cv);
    const ctx = cv.getContext('2d'); const cols = ['#ff9e7a', '#ff5c9a', '#b79cff', '#6ff2c9', '#ffd66b'];
    const bits = Array.from({ length: 120 }, () => ({ x: cv.width / 2, y: cv.height * 0.3, vx: (Math.random() - 0.5) * 12, vy: Math.random() * -12 - 3, r: Math.random() * 6 + 3, c: cols[Math.floor(Math.random() * 5)], a: Math.random() * 6 }));
    let f = 0;
    (function tick() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      bits.forEach(b => { b.vy += 0.35; b.x += b.vx; b.y += b.vy; b.a += 0.2; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = b.c; ctx.fillRect(-b.r / 2, -b.r / 2, b.r, b.r * 0.6); ctx.restore(); });
      if (++f < 120) requestAnimationFrame(tick); else cv.remove();
    })();
  }

  function copy(text, ok) {
    try { navigator.clipboard.writeText(text).then(() => toast(ok), () => toast(ok)); } catch (e) { toast(ok); }
  }

  /* ------------------------------------------------------------------
   * Events.
   * ---------------------------------------------------------------- */
  document.addEventListener('input', e => {
    if (e.target.id === 'nt') {
      S.note.t = e.target.value;
      const hits = CHECKS.filter(c => c.re.test(S.note.t));
      $('checks').innerHTML = checksHtml(hits);
      $('nsave').disabled = hits.some(h => h.block) || !S.note.t.trim();
    }
    if (e.target.id === 'nr') S.note.r = e.target.value;
    if (e.target.id === 'an') { S.add.n = e.target.value; const btn = document.querySelector('[data-act="acreate"]'); if (btn) btn.disabled = !(S.add.n.trim() && S.add.ctx && S.add.adult === 'yes'); }
  });

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-nav],[data-act],[data-tabk]');
    if (!el) return;
    const d = el.dataset;
    if (d.nav) { nav(d.nav); return; }
    if (d.tabk) { go({ view: 'person', pid: S.pid, tab: d.tabk }); return; }

    switch (d.act) {
      case 'ob-next': if (S.ob < OB.length - 1) { S.ob++; renderLayer(); } else { S.obDone = true; render(); } break;
      case 'ob-prev': if (S.ob > 0) { S.ob--; renderLayer(); } break;
      case 'ob-skip': case 'ob-done': S.obDone = true; render(); break;

      case 'open': go({ view: 'person', pid: d.pid, tab: d.tab || 'aura' }); break;
      case 'hback': goBack(); break;
      case 'hfwd': goFwd(); break;
      case 'drop': S.drop = d.v; render(); toast('Added to Your Side 🪞'); break;
      case 'prep': sheet('prep'); break;
      case 'invite': sheet('invite'); break;
      case 'privacy': sheet('privacy'); break;
      case 'delall': sheet('del'); break;
      case 'delyes': S.sheet.done = true; renderLayer(); break;
      case 'wrapped': sheet('wrapped'); break;
      case 'add': S.add = null; sheet('add'); break;
      case 'dom': sheet('dom', { d: d.d }); break;
      case 'evolve': evolve(); break;
      case 'legend': sheet('legend'); break;
      case 'close': S.sheet = null; renderLayer(); break;
      case 'soon': toast('Works in the full app. Prototype stops here.'); break;
      case 'remind': S.sheet = null; renderLayer(); toast('Reminder set for after the meeting ⏰'); break;
      case 'copy': copy(P(S.pid).asks[+d.i].msg, 'Copied. Now send it 💬'); break;
      case 'asked': toast('Nice. Tell us how it went after 🎯'); break;

      case 'pick': pick(d.v); break;
      case 'replay': S.game = { i: 0, picks: [] }; render(); break;
      case 'share': sheet('share'); break;
      case 'post': toast('Card saved. Post it anywhere ✨'); break;
      case 'copylink': copy('https://every1.example/guess/alex', 'Link copied 🔗 Send it to a friend'); break;
      case 'myc': S.myCard[+d.i] = d.v; renderLayer(); break;

      case 'note': S.note = { pid: d.pid || (S.view === 'person' ? S.pid : 'maya'), t: '', r: '', where: null, who: null, how: null, m: null }; sheet('note'); break;
      case 'np': S.note.pid = d.v; renderLayer(); break;
      case 'mom': {
        const i = +d.i, m = MOMENTS[i], prev = S.note.m != null ? MOMENTS[S.note.m][1] : null;
        if (S.note.m === i) { S.note.m = null; if (S.note.t === m[1]) S.note.t = ''; }
        else { S.note.m = i; if (!S.note.t.trim() || S.note.t === prev) S.note.t = m[1]; }
        renderLayer(); break;
      }
      case 'nf': S.note[d.f] = S.note[d.f] === d.v ? null : d.v; renderLayer(); break;
      case 'ex': S.note.t = d.v; renderLayer(); break;
      case 'toread': {
        const c = CHECKS.find(x => x.k === 'trait'); const m = S.note.t.match(c.re);
        if (m) { S.note.r = (S.note.r ? S.note.r + ' ' : '') + 'felt ' + m[0]; S.note.t = S.note.t.replace(c.re, '…').replace(/\s+/g, ' ').trim(); }
        renderLayer(); toast('Moved to your read 💭 Now: what actually happened?'); break;
      }
      case 'toq': {
        const p = P(S.note.pid); p.asks.push({ q: 'Is this true? "' + S.note.t + '"', msg: 'Hey, can I ask you something? I want to hear it from you, not from someone else.' });
        S.sheet = null; renderLayer(); toast('Saved as a question for ' + p.n + ', not as a fact 🗣️'); break;
      }
      case 'nsave': {
        const n = S.note, p = P(n.pid);
        const m = n.m != null ? MOMENTS[n.m] : null;
        p.notes.push({ d: m ? m[2] : 'comm', s: m ? m[3] : 'saw', t: n.t, w: 'Just now', read: n.r || undefined });
        S.sheet = null; go({ view: 'person', pid: p.id, tab: 'notes' }); toast('Saved to ' + p.n + '\'s notebook 🔒'); break;
      }

      case 'actx': S.add.ctx = d.v; renderLayer(); break;
      case 'aad': S.add.adult = d.v; renderLayer(); break;
      case 'acreate': {
        const id = 'x' + Date.now(); const nm = S.add.n.trim().split(/\s+/)[0];
        PEOPLE.push({ id, n: nm, ctx: S.add.ctx, locked: true, notes: [], pats: [], asks: [{ q: 'What helps ' + nm + ' on a bad day?', msg: 'Random q: on a really bad day, what actually helps you? Company or space?' }] });
        S.sheet = null; go({ view: 'person', pid: id, tab: 'aura' }); confetti(); toast(nm + '\'s character starts as a sketch ✏️ It grows as you check things with them.'); break;
      }
    }
  });

  render();
  requestAnimationFrame(loop);
})();
</script>
